[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-hub-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["llm-eval==0.1.0", "pydantic>=2"]

[project.optional-dependencies]
retrieval = ["numpy", "fastembed"]

[project.entry-points."llm_eval.scenarios"]
"kg_hub.entity_extract" = "kg_hub_eval:EntityExtraction"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg_hub_eval = ["business/config/*", "assets/*"]
