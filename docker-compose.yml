# kg-hub on Synology NAS (Container Manager "Project" — Plan B / GUI deploy).
#
# This file lives at the REPO ROOT so Container Manager can use the repo as both
# the Project folder AND the Docker build context (context: .). CM does not allow
# a build context outside the selected project folder, so the compose must sit here.
#
# Layout on NAS:
#   /volume1/docker/kg-hub-src/        <- this repo (Project folder = build context)
#   ${KG_HUB_DATA_ROOT}/falkordb  <- FalkorDB RDB+AOF (rsynced from Mac)
#   ${KG_HUB_DATA_ROOT}/models    <- fastembed bge-small cache
#
# Secrets come from the explicitly selected deploy/nas/.env
# (template: deploy/nas/.env.example); do not rely on an implicit root .env.

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: kg-hub-falkordb
    restart: unless-stopped
    environment:
      - FALKORDB_ARGS=TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 30000 --requirepass ${FALKORDB_PASSWORD} --appendonly yes --appendfsync everysec
      - BROWSER=1
      # Needed INSIDE the container so the healthcheck's redis-cli -a "$FALKORDB_PASSWORD" works.
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"   # NAS-local only — never exposed on the network
      - "127.0.0.1:3001:3000"   # FalkorDB browser UI, NAS-local only
    volumes:
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/falkordb:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$FALKORDB_PASSWORD\" --no-auth-warning PING | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Read the NAS Tailscale LocalAPI every minute and atomically publish a
  # validated snapshot. DSM on this host has no user crontab, so this dedicated
  # least-privilege container owns scheduling; server/watchdog remain read-only.
  device_liveness:
    image: kg-hub-server:latest
    container_name: kg-hub-device-liveness
    restart: unless-stopped
    user: "${KG_HUB_DEVICE_LIVENESS_USER:-1027:100}"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - KG_HUB_DEVICE_LIVENESS_PATH=/device-liveness/tailscale-status.json
      - KG_HUB_TAILSCALE_BIN=/usr/local/bin/tailscale-host
      - KG_HUB_TAILSCALE_SOCKET=/tailscale-var/tailscaled.sock
    volumes:
      - /var/packages/Tailscale/target/bin/tailscale:/usr/local/bin/tailscale-host:ro
      # A read-only bind does not make LocalAPI methods read-only. Mount only the
      # exact socket, keep the container networkless, and run only the fixed status command.
      - /volume2/@appdata/Tailscale/tailscaled.sock:/tailscale-var/tailscaled.sock:ro
      # Trusted mapping/threshold config stays outside this writable runtime directory.
      # 与全局约定一致派生自单一数据根（test_nas_configuration 强制）：
      # 硬编码路径会让换盘/迁移时漏改一处就静默挂错目录。
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/device-liveness/runtime:/device-liveness
    tmpfs:
      - /tmp:size=4m,mode=1777
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
        mode: "non-blocking"
        max-buffer-size: "1m"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,time; p=\"/device-liveness/tailscale-status.json\"; raise SystemExit(0 if time.time()-os.stat(p).st_mtime < 180 else 1)'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Three consecutive sampling failures exit the loop so restart:unless-stopped
    # can recover a wedged CLI/socket instead of leaving an unhealthy zombie forever.
    command: ["sh", "-c", "failures=0; while true; do if sh /app/deploy/monitoring/nas/tailscale-liveness-snapshot.sh; then failures=0; else failures=$$((failures+1)); [ \"$$failures\" -lt 3 ] || exit 1; fi; sleep 60; done"]

  kg_hub_server:
    build:
      context: .
      dockerfile: deploy/nas/Dockerfile
    image: kg-hub-server:latest
    container_name: kg-hub-server
    restart: unless-stopped
    # Preserve service liveness under Docker log backpressure: after the bounded
    # buffer fills, Docker drops logs rather than blocking stdout/stderr writers.
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
        max-buffer-size: "4m"
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - KG_HUB_API_TOKEN=${KG_HUB_API_TOKEN}
      - KG_HUB_BIND_HOST=0.0.0.0
      - KG_HUB_BIND_PORT=8080
      - KG_HUB_FALKORDB_HOST=falkordb
      - KG_HUB_FALKORDB_PORT=6379
      - KG_HUB_FALKORDB_PASSWORD=${FALKORDB_PASSWORD}
      - KG_HUB_FALKORDB_DATABASE=kg_hub
      - KG_HUB_MODEL_GATEWAY_TOKEN=${KG_HUB_MODEL_GATEWAY_TOKEN:?set independent kg-hub caller token}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://model-gateway:39000}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-kg_hub.entity_extract}
      - EMBEDDING_DIM=384
      - FASTEMBED_CACHE_PATH=/models
      # HF unreachable from NAS container; model pre-seeded in /models, force offline.
      - FASTEMBED_LOCAL_FILES_ONLY=true
      - HF_HUB_OFFLINE=1
      # Durable backup of every /api/ingest episode body (survives graph loss).
      - KG_HUB_INGEST_BACKUP_PATH=/backup/ingest-backup.jsonl
      # LLM 并发/限速。默认全串行(对 NAS 温柔);经 .env 可调——2026-08-14 实测
      # 单条入图 80s 全卡在这里(温度只占 20% 暂停),提产能的唯一开关就是这两个。
      - SEMAPHORE_LIMIT=${KG_HUB_SEMAPHORE_LIMIT:-1}
      - KG_HUB_LLM_MIN_INTERVAL_SEC=${KG_HUB_LLM_MIN_INTERVAL_SEC:-4.0}
      # Phase B' 长文档预拆(REFINERY-DESIGN §3')。灰度开关:NAS .env 置 1 生效。
      - KG_HUB_PREDIGEST=${KG_HUB_PREDIGEST:-0}
      # 门户「精炼层」卡读 refinery 的 status.json(ro 共享卷)
      - KG_HUB_REFINERY_STATUS=/refinery-state/status.json
      # device_liveness 容器每分钟写入真实 `tailscale status --json`；server
      # 只读，用于让 dashboard 区分"设备睡眠"与"设备在线但探针失联"。
      - KG_HUB_DEVICE_LIVENESS_PATH=/device-liveness/tailscale-status.json
      - KG_HUB_DEVICE_LIVENESS_CONFIG=/device-liveness-config/device-liveness.json
      - KG_HUB_DEVICE_LIVENESS_MAX_AGE_S=180
      # 门户「模型用量与成本」卡读 tools/export_gateway_usage.py 的快照(ro 共享卷)。
      # 刻意不让 server 直连回滚见证库:网关把见证不可用当致命(对外 503),
      # 请求路径上的读者一旦持锁就可能打挂整条链路(T-0046)。
      - KG_HUB_GATEWAY_USAGE=/gateway-usage/usage.json
    volumes:
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/models:/models
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/ingest-backup:/backup
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/refinery-state:/refinery-state:ro
      # 人工断路器状态。服务端**可写**:拓扑页上的开关按钮就落在这里。
      # 其余容器只读挂载——能扳开关的只有那一个页面。
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/breakers:/breakers
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/gateway-usage:/gateway-usage:ro
      # 动态快照目录与可信配置分别只读挂载；producer 无法改告警策略。
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/device-liveness/runtime:/device-liveness:ro
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/device-liveness/device-liveness.json:/device-liveness-config/device-liveness.json:ro
    ports:
      # Host port 17171 (off the common 8080) -> container 8080. Bind to loopback
      # only: closes LAN exposure. Tailscale userspace networking auto-forwards
      # <tailscale-ip>:17171 -> 127.0.0.1:17171, so tailnet devices reach it on
      # 17171; nothing else on the LAN can. Container still listens on 8080 internally.
      - "127.0.0.1:17171:8080"

  # Always-on monitor: runs the watchdog in a loop INSIDE the NAS, so problems are
  # caught even when the Mac is asleep. Alerts go to Feishu (edge-triggered).
  # Checks: server /health, queue backlog/stuck/errors, and a timed /api/search
  # probe that flags FalkorDB being unreachable or CPU-pegged (the original incident).
  watchdog:
    build:
      context: .
      dockerfile: deploy/nas/Dockerfile
    image: kg-hub-server:latest        # same image as kg_hub_server (code + httpx)
    container_name: kg-hub-watchdog
    restart: unless-stopped
    # Same bounded, loss-tolerant delivery policy as kg_hub_server above.
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
        max-buffer-size: "4m"
    depends_on:
      - kg_hub_server
    environment:
      - KG_HUB_URL=http://kg_hub_server:8080   # internal compose network
      - KG_HUB_API_TOKEN=${KG_HUB_API_TOKEN}
      - KG_HUB_FEISHU_WEBHOOK=${KG_HUB_FEISHU_WEBHOOK}
      - KG_HUB_FALKORDB_SLOW_SEC=8
      - KG_HUB_BACKLOG_THRESHOLD=20
      - KG_HUB_DEVICE_LIVENESS_PATH=/device-liveness/tailscale-status.json
      - KG_HUB_DEVICE_LIVENESS_CONFIG=/device-liveness-config/device-liveness.json
      - KG_HUB_DEVICE_LIVENESS_MAX_AGE_S=180
      # 盘温预警:DSM 61°C 强制关机且无任何通知(8/16 因此停机 24h 无人知)。
      # 59°C 就喊人,给"及时开机/加风扇"留反应时间。
      - KG_HUB_DISK_TEMP_WARN=${KG_HUB_DISK_TEMP_WARN:-59}
    volumes:
      - /run/synostorage/disks:/disktemp:ro   # 盘温直读(免 sudo)
      # 用量导出:只读回滚见证 + 写快照给门户「模型用量与成本」卡。
      # 导出器读**文件副本**,与活库零锁交互 —— 网关把见证不可用当致命(对外 503),
      # 直接在活库上持锁可能打挂整条链路(T-0046 实测)。
      # 设备在线快照(device-liveness 容器每 60s 写)。缺这个挂载会让
      # check_capture_chain 拿不到独立 online 证据 → capture_monitor_unhealthy
      # 永久亮灯:消费方代码已上线、输入挂载却没跟上(2026-09-03 查明)。
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/device-liveness/runtime:/device-liveness:ro
      # 可信告警策略（别名等）单独只读挂载；缺它 load_config() 恒返回 {}，
      # device_state 的别名匹配整条失效（2026-09-03 查明 capture_device_aliases 未接线）。
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/device-liveness/device-liveness.json:/device-liveness-config/device-liveness.json:ro
      - /volume1/docker/model-gateway-witness:/witness:ro
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/gateway-usage:/gateway-usage
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/watchdog:/root/.kg-hub   # persist state + alerts.log
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/notify-config:/config:ro # 热加载只需读；:ro 是安全约束(该目录含飞书密钥)，
                                # 有 test_device_liveness 守着，别为"热加载"去掉它
    command: ["sh", "-c", "sleep 25; while true; do python -m tools.watchdog || true; python -m tools.export_gateway_usage --witness /witness/rollback-witness.sqlite3 --out /gateway-usage/usage.json || true; sleep 90; done"]

  # Ongoing ingest worker (runs ON the NAS, always-on). The one-time claude-mem
  # rebuild is COMPLETE, so that step was dropped from the loop. This now drives
  # the two pipelines that still receive new data:
  #   - openclaw_capsule: ingests capsules that VPS openclaw-sync.sh syncs hourly
  #   - ingest_canonical_docs: re-ingests canonical docs when they change
  # Idle (resource-light) when nothing is new. Single container = single writer
  # (writer.lock holds); both steps are idempotent via watermarks.
  ingester:
    build:
      context: .
      dockerfile: deploy/nas/Dockerfile
    image: kg-hub-server:latest
    container_name: kg-hub-ingester
    restart: unless-stopped
    # Same bounded, loss-tolerant delivery policy as kg_hub_server above.
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
        max-buffer-size: "4m"
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - KG_HUB_FALKORDB_HOST=falkordb
      - KG_HUB_FALKORDB_PORT=6379
      - KG_HUB_FALKORDB_PASSWORD=${FALKORDB_PASSWORD}
      - KG_HUB_FALKORDB_DATABASE=kg_hub
      - KG_HUB_MODEL_GATEWAY_TOKEN=${KG_HUB_MODEL_GATEWAY_TOKEN:?set independent kg-hub caller token}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://model-gateway:39000}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-kg_hub.entity_extract}
      - EMBEDDING_DIM=384
      - FASTEMBED_CACHE_PATH=/models
      # HF is unreachable from the NAS container (EADDRNOTAVAIL). Model is pre-seeded
      # into /models; force fully-offline so fastembed never contacts HuggingFace.
      - FASTEMBED_LOCAL_FILES_ONLY=true
      - HF_HUB_OFFLINE=1
      - SEMAPHORE_LIMIT=1
      - KG_HUB_LLM_MIN_INTERVAL_SEC=4.0
    volumes:
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/models:/models
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/ingest-state:/app/data
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/openclaw-src:/openclaw-src:ro
    # canonical docs only. openclaw capsules 已改走 VPS 直推 /api/ingest
    # (2026-07-23,见 docs/KNOWLEDGE-GOVERNANCE.md)——此前这里和 Mac launchd
    # 各跑一条摄入线,双写重复入图;两条旧线同日退役,勿恢复。
    # claude-mem 线由 refinery 服务经 /api/ingest 复活(2026-07-28),此处不加回。
    command: ["sh", "-c", "sleep 30; while true; do echo '[ingest] pass start'; python -m tools.ingest_canonical_docs || true; echo '[ingest] pass done, idle 600s'; sleep 600; done"]

  # kg-refinery Phase A(REFINERY-DESIGN):Level-1 claude-mem 消费者。
  # 复活休眠线:读已在同步的 db 副本 → ingest_filter 质量闸 → POST /api/ingest
  # (全治理:幂等/备份/kind链/预拆),poll-drain 串行尊重单写者。
  # 积压(boundary_id 前)只在 23:00-07:00 夜间窗口烧,白天只处理新增。
  refinery:
    build:
      context: .
      dockerfile: deploy/nas/Dockerfile
    image: kg-hub-server:latest
    container_name: kg-hub-refinery
    restart: unless-stopped
    # Same bounded, loss-tolerant delivery policy as kg_hub_server above.
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
        max-buffer-size: "4m"
    depends_on:
      - kg_hub_server
    environment:
      - KG_HUB_URL=http://kg_hub_server:8080
      - KG_HUB_API_TOKEN=${KG_HUB_API_TOKEN}
      - KG_HUB_REFINERY_DB=/data/claude-mem/claude-mem.db
      - KG_HUB_REFINERY_STATE=/state
      - KG_HUB_REFINERY_INTERVAL_SEC=90
      - KG_HUB_REFINERY_BACKLOG_PER_CYCLE=${KG_HUB_REFINERY_PER_CYCLE:-15}
      # 批内并发抽取上限。服务端写锁串行化 add_episode,所以这不提高抽取吞吐,
      # 只消除批内队头阻塞(一条 p90 180s 的慢抽取此前会堵住身后的快速失败条目)。
      - KG_HUB_REFINERY_INGEST_CONCURRENCY=${KG_HUB_REFINERY_INGEST_CONCURRENCY:-2}
      - KG_HUB_REFINERY_BACKLOG=${KG_HUB_REFINERY_BACKLOG:-1}
      # 工作窗口(CST)。2026-08-18 按 857 条温度采样重定为 01:00-08:00:
      # 实测 22-23 点是全天最热(盘温<60 的可开工比例仅 25%/40%),01-08 才是凉窗
      # (80-100%)。原 22-05 有近一半时间被温度门控空转。
      - KG_HUB_REFINERY_WINDOW_START=${KG_HUB_REFINERY_WINDOW_START:-1}
      - KG_HUB_REFINERY_WINDOW_END=${KG_HUB_REFINERY_WINDOW_END:-8}
      # 温度门控:盘温≥此值整轮歇工(2026-08 过热事件后加,保硬件优先于吞吐)
      - KG_HUB_REFINERY_MAX_DISK_TEMP=${KG_HUB_REFINERY_MAX_DISK_TEMP:-52}
    volumes:
      # 群晖盘温直读(免sudo),温度门控数据源
      - /run/synostorage/disks:/disktemp:ro
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/claude-mem:/data/claude-mem:ro
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/refinery-state:/state
      # 只读:refinery 每轮开头读它决定这一轮提不提交,自己不改。
      - ${KG_HUB_DATA_ROOT:?set absolute kg-hub data root}/breakers:/breakers:ro
    command: ["sh", "-c", "sleep 40; python -m kg_refinery"]
